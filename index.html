<!DOCTYPE html>
<html lang="en">
  <head>
    <title>la lidysisku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A fast, simple Lojban dictionary app" />
    <meta name="author" content="la lalxu" />
    <meta property="og:title" content="la lidysisku" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sisku.org/" />
    <meta
      property="og:description"
      content="A fast, simple Lojban dictionary app."
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      :root {
        font-size: 18px;
        --xinmo: #783a58;
        --dukti: #783a58;
        --pelji: #eaf1e9;
        --gusni: #eaf1e9;
        --muted: #694a59;
        --faint: #7d6470;
        --rule: #b9a9b0;
        --field: #f7faf6;
        --enserife: Georgia, "Times New Roman", Times, "DejaVu Serif", serif;
        --sanserife: Verdana, Geneva, Tahoma, "DejaVu Sans", sans-serif;
      }
      body {
        margin: 15px 8px;
        line-height: 1.3;
        color: var(--xinmo);
        background-color: var(--pelji);
        font-family: var(--enserife);
        overflow-y: scroll;
        word-break: break-word;
      }
      body.dark {
        color-scheme: dark;
        --xinmo: #eaf1e9;
        --pelji: #2a1520;
        --muted: #b5b3a9;
        --faint: #918f87;
        --rule: #6a5660;
        --field: #3a212e;
      }
      .page {
        max-width: 30em;
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        min-height: 52px;
        padding: 4px 8px 4px 15px;
        box-sizing: border-box;
        background-color: var(--dukti);
        color: var(--gusni);
      }
      h1 {
        flex: 1;
        margin: 0;
        font-family: var(--sanserife);
        font-size: 20px;
      }
      nav {
        display: flex;
      }
      button.lang {
        height: 44px;
        padding: 0 12px;
        font-family: var(--sanserife);
        font-size: 14px;
        border: 0;
        border-radius: 3px;
        background: none;
        color: inherit;
        cursor: pointer;
      }
      button.lang:hover:not(.active) {
        text-decoration: underline;
      }
      button.lang.active {
        color: var(--dukti);
        background-color: var(--gusni);
      }
      button#lightswitch {
        height: 44px;
        padding: 0 10px;
        font-size: 18px;
        line-height: 1;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      header button:focus-visible {
        outline: 2px solid var(--gusni);
        outline-offset: -2px;
      }
      header button.lang.active:focus-visible {
        outline-color: var(--dukti);
      }
      .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
      }
      .searchbox {
        position: relative;
        margin: 11px 0 15px;
      }
      label[for="search"],
      a#clear {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        color: var(--muted);
      }
      label[for="search"] {
        left: 14px;
        font-size: 19px;
      }
      a#clear {
        right: 16px;
        font-size: 18px;
        cursor: pointer;
      }
      input:placeholder-shown + a#clear {
        opacity: 0.2;
        cursor: inherit;
      }
      #search {
        display: block;
        box-sizing: border-box;
        width: 100%;
        height: 54px;
        padding: 0 44px 0 47px;
        font-family: var(--sanserife);
        font-size: 20px;
        color: var(--xinmo);
        background-color: var(--field);
        border: 2px solid var(--rule);
        border-radius: 3px;
        outline: none;
      }
      #search:focus {
        border-color: var(--xinmo);
      }
      #search::placeholder {
        color: var(--faint);
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 20px;
        margin-bottom: 18px;
        font-family: var(--sanserife);
        font-size: 13px;
        color: var(--muted);
      }
      .options label {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .options input {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        width: 16px;
        height: 16px;
        margin: 0;
        border: 1px solid var(--muted);
        border-radius: 3px;
        cursor: pointer;
      }
      .options input:checked {
        background-color: var(--xinmo);
        border-color: var(--xinmo);
      }
      .options input:checked::after {
        content: "";
        position: absolute;
        left: 4.5px;
        top: 1px;
        width: 4px;
        height: 9px;
        border: solid var(--pelji);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .options input:focus-visible {
        outline: 2px solid var(--xinmo);
        outline-offset: 1px;
      }
      #lujvo_result {
        margin-left: auto;
      }
      #lujvo_result a {
        color: var(--xinmo);
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }
      dl {
        margin: 0;
      }
      dt {
        font-family: var(--sanserife);
      }
      dd {
        content-visibility: auto;
        contain-intrinsic-size: auto 100px;
        margin-bottom: 12px;
        line-height: 1.6;
      }
      sub,
      sup {
        line-height: 0;
      }
      .notes {
        margin-top: 6px;
        line-height: 1.5;
        font-family: var(--sanserife);
        font-size: 13px;
        white-space: pre-line;
        color: var(--muted);
        border-left: 1px solid var(--rule);
        padding-left: 12px;
        padding-block: 2px;
      }
      .notes a,
      .boxnote a {
        color: var(--xinmo);
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
      }
      #results.no-notes .notes,
      #results.no-notes .more {
        display: none;
      }
      .notes.clamped {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
      }
      button.more {
        background: none;
        border: 0;
        padding: 0;
        color: var(--muted);
        font-family: var(--sanserife);
        font-size: 13px;
        text-decoration: underline;
        cursor: pointer;
      }
      .boxnote {
        line-height: 1.4;
        font-family: var(--sanserife);
        border: 1px solid var(--rule);
        border-radius: 3px;
        padding: 6px 12px 6px 31px;
        text-indent: -19px;
        margin-top: 0.5em;
        font-size: 13px;
      }
      .boxnote .icon {
        margin-right: 6px;
      }
      .etymo {
        font-style: italic;
        color: var(--faint);
      }
      mark {
        background-color: var(--dukti);
        color: var(--gusni);
        padding: 0rem 0.25rem;
      }
      .obsolete {
        text-decoration: line-through;
        font-weight: normal;
      }
      dt i {
        font-weight: normal;
        color: var(--muted);
      }
      dt a {
        display: inline-block;
        margin-left: 0.5rem;
        font-weight: bold;
        font-style: normal;
        color: inherit;
        text-decoration: none;
      }
      dt a.selmaho,
      dt a.jvs {
        border: 1px solid var(--muted);
        font-weight: normal;
        font-size: 12px;
        border-radius: 3px;
        padding: 0 6px;
        vertical-align: 1px;
        color: var(--muted);
      }
      dt a.jvs.official {
        background-color: var(--xinmo);
        border-color: var(--xinmo);
        color: var(--pelji);
        font-weight: bold;
      }
      dt a:hover {
        text-decoration: underline;
      }
      @media (max-width: 480px) {
        header {
          padding-left: 10px;
          padding-right: 2px;
        }
        h1 {
          font-size: 17px;
        }
        button.lang {
          padding: 0 7px;
          font-size: 13px;
        }
        button#lightswitch {
          padding: 0 7px;
        }
      }
    </style>
    <script src="latkerlo-jvotci/js/docs/data.js"></script>
    <script src="latkerlo-jvotci/js/docs/rafsi.js"></script>
    <script src="latkerlo-jvotci/js/docs/tarmi.js"></script>
    <script src="latkerlo-jvotci/js/docs/tools.js"></script>
    <script src="latkerlo-jvotci/js/docs/jvozba.js"></script>
    <script src="latkerlo-jvotci/js/docs/katna.js"></script>
    <script src="main.js"></script>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>lidysisku</h1>
        <nav>
          <button class="lang" data-lang="en">english</button>
          <button class="lang" data-lang="ja">日本語</button>
          <button class="lang" data-lang="jbo">lojban</button>
        </nav>
        <button id="lightswitch">…</button>
      </header>
      <input id="exp_rafsi" type="checkbox" checked style="display: none" />
      <div class="searchbox">
        <label for="search"
          ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="3" />
            <path d="M15.5 15.5 21.5 21.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" /></svg
        ></label>
        <input
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          id="search"
          placeholder="loading..."
        />
        <a href="#" id="clear" aria-label="clear" onclick="document.getElementById('search').focus()"
          ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5 19 19M19 5 5 19" fill="none" stroke="currentColor" stroke-width="3" /></svg
        ></a>
      </div>
      <div class="options">
        <label><input type="checkbox" id="show_notes" /> show notes</label>
        <label><input type="checkbox" id="match_partial" /> match partial words</label>
        <span id="lujvo_result"></span>
      </div>
      <dl id="results"></dl>
    </div>
  </body>
</html>
