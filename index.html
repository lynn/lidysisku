<!DOCTYPE html>
<html lang="en">
  <head>
    <title>la lidysisku</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A fast, simple Lojban dictionary app" />
    <meta name="author" content="la lalxu" />
    <meta property="og:title" content="la lidysisku" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sisku.org/" />
    <meta
      property="og:description"
      content="A fast, simple Lojban dictionary app."
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      :root {
        font-size: 18px;
        --xinmo: #783a58;
        --dukti: #783a58;
        --pelji: #eaf1e9;
        --enserife: Georgia, "Times New Roman", Times, "DejaVu Serif", serif;
        --sanserife: Verdana, Geneva, Tahoma, "DejaVu Sans", sans-serif;
      }
      body {
        line-height: 1.3;
        color: var(--xinmo);
        background-color: var(--pelji);
        font-family: var(--enserife);
        overflow-y: scroll;
        word-break: break-word;
      }
      body.dark {
        color-scheme: dark;
        --xinmo: #e6bd84;
        --dukti: #e6bd84;
        --pelji: #222222;
      }
      dd {
        margin-bottom: 0.5rem;
      }
      sub,
      sup {
        line-height: 0;
      }
      .notes {
        line-height: 1.4;
        font-family: var(--sanserife);
        font-size: 13px;
        white-space: pre-line;
        border-left: 1px solid;
        padding-left: 12px;
        padding-block: 2px;
      }
      .notes a {
        color: inherit;
      }
      #results.no-notes .notes,
      #results.no-notes .more {
        display: none;
      }
      .notes.clamped {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
      }
      button.more:not(.lang) {
        background: none;
        border: 0;
        padding: 0;
        color: inherit;
        font: inherit;
        font-size: 0.85em;
        text-decoration: underline;
        cursor: pointer;
      }
      .boxnote {
        line-height: 1.4;
        font-family: var(--sanserife);
        border: 1px solid var(--xinmo);
        border-radius: 3px;
        padding: 6px 12px;
        margin-top: 0.5em;
        font-size: 13px;
      }
      .boxnote a {
        color: inherit;
      }
      .etymo {
        font-style: italic;
        font-family: var(--sanserife);
        font-size: 13px;
        margin-top: 2px;
      }
      dt,
      h1 {
        font-family: var(--sanserife);
      }
      h1 {
        text-align: center;
        letter-spacing: -2;
        background-color: var(--dukti);
        color: var(--pelji);
        margin-bottom: 0;
      }
      mark {
        background-color: var(--dukti);
        color: var(--pelji);
        padding: 0rem 0.25rem;
      }
      label[for="search"] {
        padding-right: 2px;
      }
      input {
        accent-color: var(--dukti);
        font-family: var(--sanserife);
        font-size: 16px;
        border: 1px solid var(--dukti);
        border-radius: 2px;
        padding: 4px 6px;
      }
      body.dark input {
        color: var(--xinmo);
      }
      #lujvo_result {
        height: 1.5em;
        font-family: var(--sanserife);
      }
      #lujvo_result a {
        color: var(--xinmo);
      }
      .obsolete {
        text-decoration: line-through;
        font-weight: normal;
      }
      dt i {
        font-weight: normal;
      }
      dt a {
        display: inline-block;
        margin-left: 0.5rem;
        font-weight: bold;
        font-style: normal;
        color: inherit;
        text-decoration: none;
      }
      dt a.selmaho,
      dt a.jvs {
        border: 1px solid var(--xinmo);
        font-weight: normal;
        font-size: 12px;
        border-radius: 3px;
        padding: 1px 4px;
        vertical-align: text-bottom;
        color: inherit;
        text-decoration: none;
        margin-bottom: 1px;
      }
      dt a:hover {
        text-decoration: underline;
      }
      button:not(.lang) {
        padding: 3px;
      }
      button.lang {
        flex: 1;
        font-family: var(--sanserife);
        border: 1px solid var(--xinmo);
        border-radius: 4px;
        background-color: inherit;
        color: var(--xinmo);
        height: 24px;
        font-size: 14px;
        cursor: pointer;
      }
      button.lang + button.lang {
        margin-left: 4px;
      }
      button.lang.active {
        color: var(--pelji);
        background-color: var(--dukti);
        border-color: var(--dukti);
      }
      button#lightswitch {
        font-size: 18px;
        color: var(--pelji);
        background: none;
        border: none;
        position: absolute;
        cursor: pointer;
        right: 4px;
        top: 4px;
      }
      .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.125em;
      }
      a#clear {
        border: none;
        background: none;
        margin-left: -24px;
        margin-right: 8px;
        font-size: 16px;
        cursor: pointer;
        color: var(--xinmo);
      }
      input:placeholder-shown + a#clear {
        opacity: 0.2;
        cursor: inherit;
      }
    </style>
    <script src="latkerlo-jvotci/js/docs/data.js"></script>
    <script src="latkerlo-jvotci/js/docs/rafsi.js"></script>
    <script src="latkerlo-jvotci/js/docs/tarmi.js"></script>
    <script src="latkerlo-jvotci/js/docs/tools.js"></script>
    <script src="latkerlo-jvotci/js/docs/jvozba.js"></script>
    <script src="latkerlo-jvotci/js/docs/katna.js"></script>
    <script src="main.js"></script>
  </head>
  <body>
    <div style="max-width: 30em; margin: auto">
      <header style="position: relative">
        <h1><span>lidysisku</span></h1>
        <button id="lightswitch">…</button>
      </header>
      <div style="display: flex; justify-content: center; margin: 4px 0 12px">
        <button class="lang" data-lang="en">english</button>
        <button class="lang" data-lang="ja">日本語</button>
        <button class="lang" data-lang="jbo">lojban</button>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 4px 24px; margin-bottom: 8px; font-family: var(--sanserife); font-size: 14px">
        <label><input type="checkbox" id="show_notes" /> show notes</label>
        <label><input type="checkbox" id="match_partial" /> match partial words</label>
      </div>
      <label for="search"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="3" />
          <path d="M15.5 15.5 21.5 21.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" /></svg
      ></label>
      <input id="exp_rafsi" type="checkbox" checked style="display: none" />
      <input
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        id="search"
        placeholder="loading..."
      />
      <a href="#" id="clear" onclick="document.getElementById('search').focus()"
        ><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M6 2h12a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4zM8.4 6.6 12 10.2l3.6-3.6 1.8 1.8-3.6 3.6 3.6 3.6-1.8 1.8-3.6-3.6-3.6 3.6-1.8-1.8 3.6-3.6-3.6-3.6z"
          /></svg
      ></a>
      <span id="lujvo_result"></span>
      <dl id="results"></dl>
    </div>
  </body>
</html>
